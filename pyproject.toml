[project]
name = "personal-agent"
version = "0.1.0"
description = "A local web IDE with Claude-powered chat, implementation, review, and research agents for your own repos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pywinpty>=2.0.15; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
personal-agent = "personal_agent:main"

# A windowless launcher (no console) for desktop shortcuts; see personal_agent/launcher.py.
[project.gui-scripts]
personal-agent-app = "personal_agent.launcher:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
