# Copy to config.yaml (git-ignored) and list the repos the agents may touch.
# access: read  -> agents can read and run read-only commands; every file edit is blocked
# access: write -> agents can edit files (they still can't push to main, force-push, or merge)
repos:
  - name: my-app
    path: C:/Users/you/code/my-app      # or /home/you/code/my-app
    access: write
    github: you/my-app                  # optional, owner/repo
    # Optional. Each task gets its own git worktree; node_modules folders from the main checkout are
    # linked into it automatically. `setup` runs extra shell commands in a new worktree (10 min limit
    # each; a failure is logged in the task, not fatal). `verify` lists the commands that run the
    # tests / type checker, given to the implementer and reviewer; left empty, they are detected.
    # setup:
    #   - uv sync
    # verify:
    #   - uv run pytest tests
    #   - cd frontend && npm run typecheck

models:            # aliases ("opus", "sonnet", "haiku") or full model IDs
  orchestrator: sonnet
  implementer: opus
  reviewer: opus
  researcher: sonnet

max_turns: 60
# Review rounds per task. A fix + re-review only follows a review with blocking findings;
# should_fix and nit findings are listed in the review without another round.
max_review_rounds: 2
port: 8000

# subscription: always bill agent runs to your claude.ai plan (API keys in the environment are ignored)
# api: allow ANTHROPIC_API_KEY, billed to your Claude Platform account
billing: subscription

# Remote access (e.g. from your phone over Tailscale). Every device must sign in with the
# token stored in data/remote_token. Leave disabled unless you need it.
remote:
  enabled: false
  host: 0.0.0.0

# Optional push notifications through https://ntfy.sh. Use a long, unguessable topic name.
notifications:
  ntfy_topic: null

# Run commits, pushes, PRs, installs etc. without asking. Merging a PR always asks; hard blocks still apply.
auto_approve: false
